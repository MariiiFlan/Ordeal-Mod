// Ordeal — talent JSON sync.
//
// Runs sync_talents.py before resources are packed, so every build carries the
// numbers you typed into the procedure blocks into the talent JSONs. Nothing to
// click and nothing to remember: press play in MCreator and the tooltips match
// what the abilities actually do.
//
// Apply from mcreator.gradle (NOT build.gradle — MCreator regenerates that):
//     apply from: 'sync_talents.gradle'
//
// If Python is not installed the build carries on and just says so.

tasks.register('syncTalents') {
    def script = file('sync_talents.py')
    def procDir = file('src/main/java/net/mcreator/ordeal/procedures')

    // deliberately no inputs/outputs: the sync takes milliseconds, and an
    // up-to-date check would quietly skip it on the exact builds that matter
    outputs.upToDateWhen { false }

    doLast {
        if (!script.exists()) {
            println "[OrdealTalents] sync_talents.py not found - skipped."
            return
        }
        def launcher = null
        for (String candidate : (org.gradle.internal.os.OperatingSystem.current().isWindows()
                ? ['py', 'python', 'python3'] : ['python3', 'python'])) {
            try {
                def probe = new ProcessBuilder(candidate, '--version').redirectErrorStream(true).start()
                probe.waitFor()
                if (probe.exitValue() == 0) { launcher = candidate; break }
            } catch (ignored) {
            }
        }
        if (launcher == null) {
            println "[OrdealTalents] Python not found - talent JSONs not synced."
            return
        }
        // ProcessBuilder rather than Gradle's exec {} - exec inside a task
        // action is deprecated in Gradle 8 and gone in 9, and it does not play
        // nicely with the configuration cache MCreator turns on.
        def proc = new ProcessBuilder(launcher, script.absolutePath,
                '--root', projectDir.absolutePath)
                .directory(projectDir)
                .redirectErrorStream(true)
                .start()
        def text = proc.inputStream.text.trim()
        proc.waitFor()
        if (proc.exitValue() != 0) {
            println "[OrdealTalents] sync failed:\n${text}"
        } else if (text.isEmpty()) {
            println "[OrdealTalents] JSONs already match the procedures."
        } else {
            println "[OrdealTalents] ${text}"
        }
    }
}

tasks.named('processResources') {
    dependsOn 'syncTalents'
}
